base_url = "https://shipcheck.run"
title = "shipcheck"
description = "Your agent already ran the tests. shipcheck turns that run into the GitHub check its PR waits for."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = false

# Classes, with the colors in the giallo.css Zola writes, so code keeps the site's background
[markdown.highlighting]
theme = "github-light"
style = "class"
