<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='giallo.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ get_url(path='apple-touch-icon.png') }}">
  <meta property="og:image" content="{{ get_url(path='logo.png') }}">
  <meta name="twitter:card" content="summary">
  <meta name="msvalidate.01" content="1E23FE8F3E5156774B23B549B3D18E10">
  <link rel="alternate" type="text/plain" title="llms.txt" href="{{ get_url(path='llms.txt') }}">
  {%- if page %}
  <link rel="alternate" type="text/markdown" href="{{ get_url(path='docs/' ~ page.slug ~ '.md') }}">
  {%- elif section and section.path == "/docs/" %}
  <link rel="alternate" type="text/markdown" href="{{ get_url(path='docs.md') }}">
  {%- endif %}
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ get_url(path='@/_index.md') }}">shipcheck</a>
    <nav aria-label="Site">
      <a href="{{ get_url(path='@/docs/_index.md') }}">Docs</a>
      <a href="{{ get_url(path='@/docs/quickstart.md') }}">Quickstart</a>
      <a href="https://github.com/gabrielkoerich/shipcheck">Source</a>
    </nav>
  </header>
  {% block content %}{% endblock content %}
  <footer class="site-footer">
    <p>shipcheck is MIT licensed. In act mode it runs workflows with <a href="https://github.com/nektos/act">act</a>. It clones checkouts with <a href="https://crates.io/crates/git-cow">git-cow</a>.</p>
  </footer>
</body>
</html>
