[package]
name = "shipcheck"
version = "0.2.4"
edition = "2024"
description = "Run your CI checks locally, cache the result by git tree, and post it as the PR's required checks"
license = "MIT"
repository = "https://github.com/gabrielkoerich/shipcheck"
homepage = "https://shipcheck.run"
readme = "README.md"
keywords = ["ci", "github-actions", "act", "agents"]
categories = ["command-line-utilities", "development-tools"]
# Only the code goes in the crate, not the site or the docs. SKILL.md is compiled in
include = ["/build.rs", "/src/**", "/LICENSE", "/README.md", "/SKILL.md"]

# cargo binstall and mise download the signed release archive instead of building from source
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/shipcheck-{ target }.tar.gz"
bin-dir = "shipcheck{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
toml = "0.9"
yaml-rust2 = "0.13"
git-cow = "0.4"
ureq = { version = "3", features = ["json"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
globset = "0.4.20"
libc = "0.2.191"
sandbox-jail = "0.1"
tempfile = "3.27.0"
cliclack = "0.5.6"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }

