runner = "host"
on = ["push", "commit"]

[host]
checks = { fmt = "cargo fmt --check", clippy = "cargo clippy --all-targets -- -D warnings", test-macos = "cargo test", gitleaks = "d=$(mktemp -d \"$HOME/scan.XXXXXX\") && git archive HEAD | tar -x -C \"$d\" && gitleaks dir --redact --no-banner \"$d\"" }
versions = ["cargo --version", "rustc --version", "gitleaks version"]

[jobs."ci.yml/test"]
runner = "act"
engine = "colima"
